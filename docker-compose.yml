services:
  postgres:
    image: postgres:16-alpine
    container_name: genonexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geno
      POSTGRES_PASSWORD: geno
      POSTGRES_DB: genonexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres_data:

